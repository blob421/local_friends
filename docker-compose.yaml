services:
  backend:
    build:
      context: .
      dockerfile: ./app/backend/Dockerfile

    entrypoint: ["/usr/src/app/app/backend/entrypoint.sh"]

      
    environment:
      - NODE_ENV=production
    volumes:
      - mediaData:/usr/src/app/media/
    ports:
      - "3000:3000"
    env_file:
      - .env
    
    depends_on:
      - rabbitmq
      - postgres
    restart:
       always


  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: local_friends 
    ports: 
      - "27017:27017" 
    volumes: 
      - mongoData:/data/db 

  redis:
    image: redis
    ports:
      - "6379:6379"

  frontend:
    build:
      context: .
      dockerfile: ./app/frontend/my-app/Dockerfile
    ports:
      - "3001:3001"
    command:
      yarn start
    environment:
     - PORT=3001
    restart:
      always
  worker:
    build:
      context:
        .
      dockerfile:
        ./app/scheduler/Dockerfile
    restart:
      always
    entrypoint: ["/usr/src/app/app/scheduler/entrypoint.sh"]
    env_file:
      - ./app/scheduler/.env
    depends_on:
      - rabbitmq
      - postgres
      - redis

 
  pika:
    build: 
      context: ./ML
    
        
    working_dir: /ML
    command: python detect.py
    volumes:
      - mediaData:/usr/src/app/media/
    env_file:
      - .env
    restart: always
    depends_on:
      - rabbitmq

  
  rabbitmq:
    image: rabbitmq:management-alpine
    ports:
      - "5672:5672"
    environment:
    - RABBITMQ_DEFAULT_USER=admin
    - RABBITMQ_DEFAULT_PASS=secret
    restart:
      always

 
    
  postgres:
    image: postgres:17
   
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /usr/src/app/csv:/usr/src/app/csv/:ro
      - C:/Users/gabri/Desktop/Python/local_friends/regions.csv:/data/regions.csv

    restart: always
    env_file:
      - .env


volumes:
    pgdata:
    mediaData:
    mongoData:
