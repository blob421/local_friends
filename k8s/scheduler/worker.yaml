apiVersion: v1
kind: StatefulSet
metadata:
  name: scheduler

spec:
  serviceName: scheduler-svc
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          ports:
            - containerPort: 3003
          command: ["/bin/bash", "-c", "/usr/src/app/app/scheduler/entrypoint.sh"]
          envFrom:
            - configMapRef:
              name: worker-env

          image: blob421/local_friends-worker:latest
          volumeMounts:
            - name: media-pvc
              mountPath: /usr/src/app/media/
      volumes:
      - name: media-pvc
        persistentVolumeClaim:
          claimName: mediaData
         

